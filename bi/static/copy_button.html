<!doctype html><html><head><meta charset='utf-8'><style>body{margin:0;font:13px system-ui,sans-serif}button{font:inherit;padding:5px 12px;border-radius:8px;border:1px solid __GO_BORDER__;background:transparent;color:__GO_INK__;cursor:pointer}pre{position:absolute;left:-9999px}</style></head><body><button id='copy'>__GO_HTML_ESCAPE_LABEL__</button><pre id='text'></pre><script type='application/json' id='data'>__GO_PAYLOAD__</script><script>const D=JSON.parse(document.getElementById('data').textContent);const b=document.getElementById('copy'),pre=document.getElementById('text'),name=b.textContent;pre.textContent=D.text;b.onclick=async()=>{try{await navigator.clipboard.writeText(D.text);b.textContent=D.done;}catch(e){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=D.selected;}setTimeout(()=>{b.textContent=name;},1500);};</script></body></html>
