# D-323, D-330, D-331: measures the 12 quality indicators (data and code) on every push and checks them against
# docs/calidad/metas.json, failing when a code indicator is past its acceptable: on a push that is the CI's check, no
# report. D-363, D-431: the report is weekly and holds only the data indicators, so only after a weekly load that ended
# in green (workflow_run of «semanal», its tests passed and the database is published) does it turn the measurement
# into the next weekly report (docs/calidad/informes/semanales/) and propose it to the author in a pull request
# «Actualizar medición de calidad», with the comparison against the previous report; a push only measures. It never
# changes the code. D-436: the request is merged by itself when every code indicator is within its acceptable; otherwise
# the author merges it. The page «Método y calidad» shows a report only once it is merged. D-555: the suite runs once per
# push, in the groups of pruebas.yml; this run waits for them and reuses their coverage instead of running it again.
# Opening the request needs Settings → Actions → General → «Allow GitHub Actions to create and approve pull requests».
name: calidad
on:
  push:
  workflow_dispatch:
  # D-363: after every weekly load; D-431: only a load that ended in green leaves its report.
  workflow_run:
    workflows: [semanal]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Entorno del proyecto
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest-cov
          .venv/bin/python bi/served_database.py
      - name: Herramientas de calidad (fuera del proyecto)
        run: |
          python -m venv /tmp/tools
          # D-330: only the tools of the two qualities (data and code); no browsers.
          /tmp/tools/bin/pip install ruff==0.17.2 mypy==2.4.0 bandit==1.9.4 pip-audit==2.10.1 detect-secrets==1.5.0
      - name: Cobertura de pruebas.yml
        # D-555: on a push, the run of pruebas.yml of the same commit; after a weekly load, the last green one of main. Only
        # a run in green lends its coverage; otherwise «Medir» runs the suite itself.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            for attempt in $(seq 1 20); do
              run=$(gh run list --workflow pruebas.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId')
              [ -n "$run" ] && break
              sleep 15
            done
            gh run watch "$run" --interval 30 > /dev/null || true
          else
            run=$(gh run list --workflow pruebas.yml --branch main --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ "$(gh run view "$run" --json conclusion --jq .conclusion)" = "success" ]; then
            gh run download "$run" --pattern 'cobertura-*' --dir cobertura
          fi
      - name: Medir
        run: .venv/bin/python scripts/medir_calidad.py --tools /tmp/tools/bin --output medicion.json --coverage cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: medicion-${{ github.sha }}
          path: medicion.json
      - name: Comparar con los aceptables
        id: verificar
        continue-on-error: true
        run: .venv/bin/python scripts/verificar_calidad.py medicion.json
      - name: Proponer el informe al autor
        # D-363: a push or a manual launch only measures. D-431: the report comes only after a weekly load in green, never
        # in the middle of a deployment.
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # D-436: a report still open (not merged because the code was out of range) is replaced by this one, which
          # takes its number: it is closed with a note and its branch deleted, so two requests never propose one number.
          gh pr list --state open --json number,title --jq '.[] | select(.title == "Actualizar medición de calidad") | .number' |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Reemplazado por el informe de ${GITHUB_SHA::7} (D-436)."
            done
          # F-11 (D-362): a remote branch named «calidad» blocked every «calidad/...» branch; the prefix is its own.
          branch="informe-calidad/${GITHUB_SHA::7}"
          cp medicion.json docs/calidad/medicion.json
          .venv/bin/python scripts/informe_calidad.py --cuerpo cuerpo.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # D-401: the script also registers the report's non-conformities, so merging the report keeps main green.
          git add docs/calidad/medicion.json docs/calidad/historial.json docs/calidad/INFORME.md docs/calidad/informes \
            docs/calidad/no_conformidades.json
          git commit -m "chore(calidad): informe de calidad de ${GITHUB_SHA::7} (D-331)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Actualizar medición de calidad" --body-file cuerpo.md
          # D-436: merged at once when every code indicator is within its acceptable (the step «verificar»), so the report
          # never freezes; otherwise it waits for the author. A direct merge needs no «Allow auto-merge»; if a branch
          # rule of main refuses it, the request stays open for the author and the run says so.
          if [ "${{ steps.verificar.outcome }}" = "success" ]; then
            merged=""
            for attempt in 1 2 3; do  # a request just opened may need a few seconds before it can be merged
              gh pr merge "$branch" --squash --delete-branch \
                --subject "chore(calidad): informe semanal de calidad de ${GITHUB_SHA::7} (D-436)" && merged=yes && break
              sleep 15
            done
            [ -n "$merged" ] || echo "::warning::El informe quedó abierto: main no aceptó la fusión automática (D-436)."
          fi
      - name: Fallar si un indicador de código pasa lo aceptable
        if: steps.verificar.outcome == 'failure'
        run: exit 1
