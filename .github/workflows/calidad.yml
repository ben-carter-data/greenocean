# D-323: measures the quality indicators on every push and checks them against docs/calidad/metas.json.
# It writes the measurement (with its date and commit) as an artifact and, on main, proposes it to the author in a pull
# request «Actualizar medición de calidad» with the comparison against the previous one. It never changes the code and
# never publishes anything: the page «Método y calidad» shows a measurement only after the author merges that request.
# Opening the request needs Settings → Actions → General → «Allow GitHub Actions to create and approve pull requests».
name: calidad
on:
  push:
  workflow_dispatch:
  # Once a week, when the author turns it on (D-323): remove the # of the next two lines.
  # schedule:
  #   - cron: "0 14 * * 1"
permissions:
  contents: write
  pull-requests: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Entorno del proyecto
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest-cov
          .venv/bin/python bi/served_database.py
      - name: Herramientas de calidad (fuera del proyecto)
        run: |
          python -m venv /tmp/tools
          # D-330: only the tools of the two qualities (data and code); no browsers.
          /tmp/tools/bin/pip install ruff==0.17.2 mypy==2.4.0 bandit==1.9.4 pip-audit==2.10.1 detect-secrets==1.5.0
      - name: Medir
        run: .venv/bin/python scripts/medir_calidad.py --tools /tmp/tools/bin --output medicion.json
      - uses: actions/upload-artifact@v4
        with:
          name: medicion-${{ github.sha }}
          path: medicion.json
      - name: Proponer la medición al autor
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="calidad/medicion-${GITHUB_SHA::7}"
          cp docs/calidad/medicion.json anterior.json
          cp medicion.json docs/calidad/medicion.json
          .venv/bin/python scripts/informe_calidad.py --anterior anterior.json --cuerpo cuerpo.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/calidad/medicion.json docs/calidad/historial.json docs/calidad/INFORME.md
          git commit -m "chore(calidad): actualizar medición de calidad (D-323)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Actualizar medición de calidad" --body-file cuerpo.md
      - name: Comparar con las metas
        run: .venv/bin/python scripts/verificar_calidad.py medicion.json
