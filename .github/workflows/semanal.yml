name: semanal

# Weekly load: download, ETL, dbt build, tests, publish the database and the report.
# If a step fails the next ones do not run, so the published database is only
# replaced by a load that passed every check.
# D-270: the served database lives in the release «base-actual», replaced every week;
# git keeps only its pointer, etl/datos.version, so the history no longer grows with it.
on:
  schedule:
    # Tuesdays at 12:00 UTC (09:00 in Chile in summer time, 08:00 in winter time).
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Forzar una falla después del ETL (prueba de T-23)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  weekly-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # D-351: GitHub cuts a stuck load; the panel's window stops asking at the same minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-pipeline.txt

      # D-047: the files of closed years do not change, so they are kept in the
      # Actions cache. The agent skips a closed year whose file is already there
      # and downloads it when the cache expired. The key changes with the
      # current year and with input.csv: in January the year that just closed
      # is downloaded complete once, instead of reusing a copy from mid-year.
      - name: Find the current year
        id: current_year
        run: echo "year=$(date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Restore the closed-year files
        uses: actions/cache@v4
        with:
          path: agent/downloads/*.csv
          key: odepa-files-${{ steps.current_year.outputs.year }}-${{ hashFiles('agent/input.csv') }}

      # The load history (etl_run) and the 90 % check read the database published last week.
      - name: Get the published database
        run: python bi/served_database.py

      - name: Download the ODEPA files
        run: python agent/agent.py

      # The SQLite backup (etl/datos.db), built on this machine for the parity test and never
      # published (D-154, D-270).
      - name: Run the ETL (SQLite backup)
        run: python etl/etl.py

      # Bronze in Parquet, then dbt builds and tests every model; the panel's DuckDB
      # file is replaced only if everything passed.
      - name: Build the data warehouse with dbt
        run: python etl/pipeline.py

      - name: Simulate a failure
        if: ${{ inputs.simulate_failure }}
        run: exit 1

      # Includes the parity test: SQLite and DuckDB must hold the same figures.
      - name: Run the tests against the new database
        run: pytest -q -m "not rendimiento"  # D-341: speed budgets run locally, not on a shared runner

      # First the file replaces the one in the release, then the pointer is committed: the panel
      # never reads a pointer whose file is not there yet.
      - name: Publish the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload base-actual etl/datos.duckdb --clobber
          python bi/served_database.py --pointer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etl/datos.version agent/downloads/manifest.json
          git commit -m "Weekly data update"
          git push

      - name: Publish the weekly report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bi/report.py > report.md
          gh issue create --title "Informe semanal $(date +%Y-%m-%d)" --body-file report.md
