name: semanal

# Weekly load: download, ETL, dbt build, tests, publish the database and the report.
# If a step fails the next ones do not run, so the published database is only
# replaced by a load that passed every check.
# D-270: the served database lives in the release «base-actual», replaced every week;
# git keeps only its pointer, etl/datos.version, so the history no longer grows with it.
on:
  schedule:
    # D-485, D-487: on Tuesdays, an attempt every 15 minutes from 12:07 to 14:52 UTC (09:07 to 11:52 in Chile in summer
    # time), so the data is ready before noon, then one every hour until 02:07 UTC (23:07 in Chile). GitHub delays or
    # skips scheduled runs when it is busy, most at the top of the hour; the guard below makes an attempt do nothing once
    # a load of this Tuesday is green. If none started on Tuesday, the Author launches it by hand.
    - cron: "7,22,37,52 12-14 * * 2"
    - cron: "7 15-23 * * 2"
    - cron: "7 0-2 * * 3"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Forzar una falla después del ETL (prueba de T-23)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  # D-485 lets the guard read today's runs of this workflow
  actions: read

# D-485: one load at a time; an attempt that starts while another runs waits for it, so two never publish together.
concurrency:
  group: semanal
  cancel-in-progress: false

# D-567: an outage of PyPI or GitHub is waited out, not turned into a red push: pip tries each download again.
env:
  PIP_RETRIES: "10"
  PIP_TIMEOUT: "60"
jobs:
  weekly-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # D-351: GitHub cuts a stuck load; the panel's window stops asking at the same minute
    steps:
      # D-485, D-487: a scheduled attempt runs only if no load of this workflow was green since this Tuesday (UTC), so
      # an attempt GitHub starts late, even on Wednesday, never repeats the load; a manual run always runs. The later
      # steps read the answer, so a skipped attempt ends in seconds and records nothing in etl_run.
      - name: Check whether this Tuesday's load is already done
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tuesday=$(date -u -d "$((($(date -u +%u) + 5) % 7)) days ago" +%Y-%m-%d)  # %u: Monday 1 … Sunday 7
          done=$(gh run list -R "$GITHUB_REPOSITORY" --workflow semanal.yml --status success \
            --created ">=$tuesday" --json databaseId --jq 'length')
          if [ "$done" -gt 0 ]; then
            echo "A load of this Tuesday is already green: this attempt does nothing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip  # D-567: the packages come from the Actions cache when they can
          cache-dependency-path: requirements*.txt
      # D-568: an install that fails whole is tried twice more
      - run: for attempt in 1 2 3; do pip install -r requirements-pipeline.txt && exit 0; sleep $((attempt * 30)); done; exit 1
        if: steps.guard.outputs.run == 'true'

      # D-047: the files of closed years do not change, so they are kept in the
      # Actions cache. The agent skips a closed year whose file is already there
      # and downloads it when the cache expired. The key changes with the
      # current year and with input.csv: in January the year that just closed
      # is downloaded complete once, instead of reusing a copy from mid-year.
      - name: Find the current year
        if: steps.guard.outputs.run == 'true'
        id: current_year
        run: echo "year=$(date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Restore the closed-year files
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: agent/downloads/*.csv
          key: odepa-files-${{ steps.current_year.outputs.year }}-${{ hashFiles('agent/input.csv') }}

      # The load history (etl_run) and the 90 % check read the database published last week.
      - name: Get the published database
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}  # D-567: read as the workflow, not anonymously
        run: python bi/served_database.py

      - name: Download the ODEPA files
        if: steps.guard.outputs.run == 'true'
        run: python agent/agent.py

      # The SQLite backup (etl/datos.db), built on this machine for the parity test and never
      # published (D-154, D-270).
      - name: Run the ETL (SQLite backup)
        if: steps.guard.outputs.run == 'true'
        run: python etl/etl.py

      # Bronze in Parquet, then dbt builds and tests every model; the panel's DuckDB
      # file is replaced only if everything passed.
      - name: Build the data warehouse with dbt
        if: steps.guard.outputs.run == 'true'
        run: python etl/pipeline.py

      - name: Simulate a failure
        if: ${{ steps.guard.outputs.run == 'true' && inputs.simulate_failure }}
        run: exit 1

      # Includes the parity test: SQLite and DuckDB must hold the same figures.
      - name: Run the tests against the new database
        if: steps.guard.outputs.run == 'true'
        # D-366: only the tests of the data and the pipeline; the screens are checked by the CI of every push and
        # never stop the data from being published. D-341: speed budgets run locally, not on a shared runner.
        run: pytest -q -m "datos and not rendimiento"

      # First the file replaces the one in the release, then the pointer is committed: the panel
      # never reads a pointer whose file is not there yet.
      - name: Publish the database
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload base-actual etl/datos.duckdb --clobber
          python bi/served_database.py --pointer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etl/datos.version agent/downloads/manifest.json
          git commit -m "Weekly data update"
          git push

      - name: Publish the weekly report
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python bi/report.py > report.md
          new=$(gh issue create --title "Informe semanal $(date +%Y-%m-%d)" --body-file report.md)
          # D-438: only the latest report stays open; the earlier ones are closed after the new one exists, pointing to it.
          gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | startswith("Informe semanal ")) | .number' |
            { grep -vx "${new##*/}" || true; } |  # with no earlier report, grep finds nothing: not a failure
            while read -r old; do
              gh issue close "$old" --comment "Reemplazado por el informe de esta semana: $new (D-438)."
            done
