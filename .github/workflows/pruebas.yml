name: pruebas
on:
  push:
  pull_request:
permissions:
  contents: read  # D-567: the token reads the release «base-actual», nothing more
# D-567: an outage of PyPI or GitHub is waited out, not turned into a red push: pip tries each download again.
env:
  PIP_RETRIES: "10"
  PIP_TIMEOUT: "60"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip  # D-567: the packages come from the Actions cache when they can
          cache-dependency-path: requirements*.txt
      # D-568: an install that fails whole (an outage longer than pip's own retries) is tried twice more
      - run: for attempt in 1 2 3; do pip install ruff==0.17.2 mypy==2.4.0 -r requirements.txt && exit 0; sleep $((attempt * 30)); done; exit 1
      # D-323: 0 findings, everything formatted and the main modules typed.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # D-527: the suite took 14.6–15.1 min at 410d6e0 and the 15-minute cap cancelled it
    strategy:
      fail-fast: false
      matrix:
        # The supported versions (docs/operacion/MANUAL.md): dbt Core runs on 3.11 and 3.12.
        python-version: ["3.11", "3.12"]
        # D-555: the suite in three groups that run at the same time (scripts/grupo_pruebas.py), about a third each.
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # D-567: the packages come from the Actions cache when they can
          cache-dependency-path: requirements*.txt
      - run: for attempt in 1 2 3; do pip install -r requirements-pipeline.txt pytest-cov && exit 0; sleep $((attempt * 30)); done; exit 1
      # The dbt project must compile on every change (models, tests, sources): once per version.
      - if: matrix.group == 1
        run: dbt parse --project-dir dbt --profiles-dir dbt
      # The served database is not in git (D-270): the tests read the one the last load published.
      # D-567: with the workflow's token, so a GitHub outage that limits anonymous downloads does not stop the tests.
      - run: python bi/served_database.py
        env:
          GH_TOKEN: ${{ github.token }}
      # D-555: on 3.12 each group keeps its coverage and its counts; calidad.yml combines them and checks the 90 %.
      # D-557: 3.12 measures with sys.monitoring (COVERAGE_CORE=sysmon): the old tracer of 3.11 took one group from
      # 5 to 29 minutes. Every group leaves its slowest tests as notices, readable without opening the log.
      - run: |
          files=$(python scripts/grupo_pruebas.py ${{ matrix.group }} 3)
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            COVERAGE_CORE=sysmon COVERAGE_FILE=.coverage.${{ matrix.group }} pytest -q -m "not rendimiento" \
              -o faulthandler_timeout=90 --cov --cov-report= --cov-fail-under=0 --junitxml=junit-${{ matrix.group }}.xml $files
          else
            pytest -q -m "not rendimiento" -o faulthandler_timeout=90 --junitxml=junit-${{ matrix.group }}.xml $files
          fi
      - if: always()
        # D-568: the slowest tests and, in red, every failed one with its error, readable without opening the log
        run: python scripts/pruebas_lentas.py junit-${{ matrix.group }}.xml "${{ matrix.python-version }} · grupo ${{ matrix.group }}"
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.group }}
          path: |
            .coverage.${{ matrix.group }}
            junit-${{ matrix.group }}.xml
          include-hidden-files: true
