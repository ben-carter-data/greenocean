# El motor del data warehouse se elige aquí; los modelos no cambian (ADR-30).
greenocean:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # El workflow construye en un archivo temporal y lo reemplaza solo si todo pasa.
      path: "{{ env_var('GREENOCEAN_DUCKDB', '../etl/datos.duckdb') }}"
      threads: 4

