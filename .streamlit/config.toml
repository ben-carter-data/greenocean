# Two themes: Vantablack with raised slate surfaces, and Corporativo.
# The page stays black in Vantablack; fields and cards have their own contrast.
[theme]
base = "dark"
baseRadius = "large"
showSidebarBorder = false

[theme.dark]
primaryColor = "#2fd3f0"
backgroundColor = "#030304"
secondaryBackgroundColor = "#121a27"
textColor = "#f3f5f9"
borderColor = "#344256"

[theme.light]
primaryColor = "#1d5fbf"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e7ed"

[browser]
gatherUsageStats = false
