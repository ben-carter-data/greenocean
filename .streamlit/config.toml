# Streamlit's native bases support the app palettes: Corporativo and Blue Light on the
# light base, Vantablack and Dark Grey on the dark one. The default theme is Corporativo,
# so the app starts on the light base. Fields and cards keep their own contrast.
[theme]
base = "light"
baseRadius = "large"
showSidebarBorder = false

[theme.dark]
primaryColor = "#2fd3f0"
backgroundColor = "#030304"
secondaryBackgroundColor = "#121a27"
textColor = "#f3f5f9"
borderColor = "#344256"

[theme.light]
primaryColor = "#1d5fbf"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e7ed"

[browser]
gatherUsageStats = false

[client]
# Keep local developer actions out of the report canvas. This also removes the
# floating rerun/deploy controls that can cover content on narrow viewports.
toolbarMode = "viewer"
