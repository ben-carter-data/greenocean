# Streamlit's native bases support the app palettes: Vantablack, Grafito and
# Corporativo. Fields and cards keep their own contrast in every palette.
[theme]
base = "dark"
baseRadius = "large"
showSidebarBorder = false

[theme.dark]
primaryColor = "#2fd3f0"
backgroundColor = "#030304"
secondaryBackgroundColor = "#121a27"
textColor = "#f3f5f9"
borderColor = "#344256"

[theme.light]
primaryColor = "#1d5fbf"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e7ed"

[browser]
gatherUsageStats = false

[client]
# Keep local developer actions out of the report canvas. This also removes the
# floating rerun/deploy controls that can cover content on narrow viewports.
toolbarMode = "viewer"
