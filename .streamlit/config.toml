# Streamlit's native bases support the app palettes: Corporativo and Blue Light on the
# light base, Vantablack and Dark Grey on the dark one. The default theme is Vantablack (D-349),
# so the app starts on the dark base. Fields and cards keep their own contrast.
[theme]
base = "dark"
# The system font (San Francisco on Apple, Segoe UI on Windows), fine and quiet,
# instead of Streamlit's Source Sans (D-175). Code keeps a monospace stack.
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseRadius = "large"
showSidebarBorder = false

[theme.dark]
primaryColor = "#2fd3f0"
backgroundColor = "#030304"
secondaryBackgroundColor = "#121a27"
textColor = "#f3f5f9"
borderColor = "#344256"

[theme.light]
primaryColor = "#1d5fbf"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e7ed"

[browser]
gatherUsageStats = false

[client]
# Keep local developer actions out of the report canvas. This also removes the
# floating rerun/deploy controls that can cover content on narrow viewports.
toolbarMode = "viewer"

[server]
# No one edits files on the live server, so the inotify file watcher only burns the
# container's limited watch handles and can stall the whole deploy (saw it loop for
# 20+ minutes with "inotify watch limit reached" instead of starting).
fileWatcherType = "none"
